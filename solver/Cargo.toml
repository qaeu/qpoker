[package]
name = "qpoker-solver"
version = "0.1.0"
authors = ["Wataru Inariba", "qpoker contributors"]
edition = "2021"
description = "qpoker's vendored copy of b-inary/postflop-solver, with a WASM API"
repository = "https://github.com/b-inary/postflop-solver"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "postflop_solver"
crate-type = ["cdylib", "rlib"]

[dependencies]
once_cell = "1.18.0"
rayon = { version = "1.8.0", optional = true }
regex = "1.9.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-rayon = { version = "1.3.0", optional = true }

[features]
default = ["rayon"]
rayon = ["dep:rayon"]
wasm = ["dep:wasm-bindgen"]
wasm-threads = ["wasm", "rayon", "dep:wasm-bindgen-rayon"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"

# Tests run the solver; unoptimised they would take minutes.
[profile.test]
opt-level = 3
debug = 1
